<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Loss Calculator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #57068C;
      padding: 14px 16px;
      min-height: 100vh;
      color: #ffffff;
    }

    .container { max-width: 500px; margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 { font-size: 20px; font-weight: 500; line-height: 1.15; }

    .unit-toggle {
      display: flex;
      gap: 6px;
      background: #3D0463;
      border-radius: 6px;
      padding: 3px;
      flex-shrink: 0;
    }

    .unit-btn {
      padding: 5px 11px;
      font-size: 13px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 500;
      color: #D9C2EC;
      transition: all 0.15s;
      border-radius: 4px;
    }
    .unit-btn.active { background: #ffffff; color: #000000; }
    .unit-btn:hover:not(.active) { color: #ffffff; }

    /* ---- module shell ---- */
    .module {
      background: rgba(255,255,255,0.07);
      border: 0.5px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 11px;
    }

    .module-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #D9C2EC;
      margin-bottom: 9px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #E6D9F2;
      margin-bottom: 3px;
      font-weight: 500;
    }

    input[type="number"] {
      width: 100%;
      padding: 7px 10px;
      font-size: 16px;
      border: 0.5px solid #B08FD4;
      border-radius: 8px;
      font-family: inherit;
      background: #ffffff;
      color: #000000;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.35);
    }

    .row2 {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 10px;
    }

    .button-group { display: flex; gap: 6px; margin-top: 9px; }

    .quick-btn {
      flex: 1;
      padding: 7px 4px;
      font-size: 13px;
      background: rgba(255,255,255,0.14);
      border: 0.5px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      cursor: pointer;
      color: #ffffff;
      font-weight: 600;
      transition: all 0.15s;
    }
    .quick-btn:hover { background: rgba(255,255,255,0.24); }
    .quick-btn.selected {
      background: #ffffff;
      color: #57068C;
      border-color: #ffffff;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 9px;
    }
    .slider-row span {
      font-size: 13px;
      font-weight: 600;
      min-width: 38px;
      text-align: right;
      color: #ffffff;
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: #B08FD4;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      border: 2px solid #57068C;
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      border: 2px solid #57068C;
    }

    /* ---- result cards ---- */
    .card {
      background: #cfcdc6;
      border-radius: 8px;
      padding: 9px 11px;
      border: 0.5px solid #b8b6ae;
    }
    .card-label {
      font-size: 11px;
      color: #4a4844;
      margin-bottom: 2px;
      font-weight: 500;
    }
    .card-value { font-size: 19px; font-weight: 600; color: #000000; }

    .card-primary {
      background: #EFE4F7;
      border-color: #B08FD4;
    }
    .card-primary .card-label { color: #57068C; }

    .cards2 {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 8px;
      margin-top: 9px;
    }

    .subnote {
      font-size: 12px;
      color: rgba(87,6,140,0.75);
      margin-top: 6px;
      padding-top: 6px;
      line-height: 1.45;
      border-top: 0.5px solid rgba(87,6,140,0.2);
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="topbar">
      <h1>Weight loss calculator</h1>
      <div class="unit-toggle">
        <button class="unit-btn active" data-unit="lbs" onclick="switchUnit('lbs')">lbs</button>
        <button class="unit-btn" data-unit="kg" onclick="switchUnit('kg')">kg</button>
      </div>
    </div>

    <!-- MODULE 1 — goal setting -->
    <div class="module">
      <div class="module-title">1 · Set goal</div>

      <div class="row2">
        <div>
          <label for="startWeight">Starting weight</label>
          <input type="number" id="startWeight" inputmode="decimal" placeholder="lbs" />
        </div>
        <div>
          <label for="targetWeight">Target weight</label>
          <input type="number" id="targetWeight" inputmode="decimal" placeholder="lbs" />
        </div>
      </div>

      <div class="button-group">
        <button class="quick-btn" data-pct="5" onclick="setGoal(5)">5%</button>
        <button class="quick-btn selected" data-pct="10" onclick="setGoal(10)">10%</button>
        <button class="quick-btn" data-pct="15" onclick="setGoal(15)">15%</button>
        <button class="quick-btn" data-pct="20" onclick="setGoal(20)">20%</button>
      </div>

      <div class="slider-row">
        <input type="range" id="goalSlider" min="1" max="50" value="10" />
        <span id="goalPercent">10%</span>
      </div>

      <div class="cards2">
        <div class="card card-primary" style="grid-column: 1 / -1;">
          <div class="card-label">Total to lose</div>
          <div class="card-value" id="totalToLose">—</div>
        </div>
      </div>
    </div>

    <!-- MODULE 2 — visit tracking -->
    <div class="module">
      <div class="module-title">2 · This visit</div>

      <div class="row2">
        <div>
          <label for="currentWeight">Current weight</label>
          <input type="number" id="currentWeight" inputmode="decimal" placeholder="lbs" />
        </div>
        <div>
          <label for="weeks">Weeks elapsed</label>
          <input type="number" id="weeks" inputmode="decimal" placeholder="0" />
        </div>
      </div>

      <div class="cards2">
        <div class="card">
          <div class="card-label">Weight lost</div>
          <div class="card-value" id="weightLost">—</div>
        </div>
        <div class="card">
          <div class="card-label">% lost</div>
          <div class="card-value" id="percentLost">—</div>
        </div>
      </div>

      <div class="cards2">
        <div class="card card-primary" style="grid-column: 1 / -1;">
          <div class="card-label">Remaining to target</div>
          <div class="card-value" id="toLose">—</div>
          <div class="subnote" id="weeklyRate" style="display:none;"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    var startInput   = document.getElementById('startWeight');
    var targetInput  = document.getElementById('targetWeight');
    var currentInput = document.getElementById('currentWeight');
    var weeksInput   = document.getElementById('weeks');
    var goalSlider   = document.getElementById('goalSlider');
    var currentUnit  = 'lbs';

    function r1(n) { return Math.round(n * 10) / 10; }
    function u() { return currentUnit; }

    function switchUnit(unit) {
      if (unit === currentUnit) return;
      var f = unit === 'kg' ? 0.453592 : 2.20462;
      [startInput, targetInput, currentInput].forEach(function (el) {
        if (el.value !== '') el.value = r1(parseFloat(el.value) * f);
      });
      currentUnit = unit;
      startInput.placeholder = unit;
      targetInput.placeholder = unit;
      currentInput.placeholder = unit;
      var btns = document.querySelectorAll('.unit-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].getAttribute('data-unit') === unit);
      }
      update();
    }

    // percentage -> target weight
    function applyPercent() {
      var start = parseFloat(startInput.value);
      var pct = parseInt(goalSlider.value, 10);
      if (start > 0) targetInput.value = r1(start * (1 - pct / 100));
      update();
    }

    // target weight -> percentage (clamped to slider range)
    function applyTarget() {
      var start = parseFloat(startInput.value);
      var target = parseFloat(targetInput.value);
      if (start > 0 && target > 0 && target < start) {
        var pct = (start - target) / start * 100;
        goalSlider.value = Math.min(50, Math.max(1, Math.round(pct)));
      }
      update();
    }

    function setGoal(v) {
      goalSlider.value = v;
      applyPercent();
    }

    function syncQuickButtons(pct) {
      var btns = document.querySelectorAll('.quick-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('selected', Number(btns[i].getAttribute('data-pct')) === pct);
      }
    }

    function update() {
      var start = parseFloat(startInput.value);
      var current = parseFloat(currentInput.value);
      var weeks = parseFloat(weeksInput.value);
      var pct = parseInt(goalSlider.value, 10);

      var pctOut = document.getElementById('goalPercent');
      syncQuickButtons(pct);

      var ttl = document.getElementById('totalToLose');
      var wl = document.getElementById('weightLost');
      var pl = document.getElementById('percentLost');
      var tl = document.getElementById('toLose');
      var wr = document.getElementById('weeklyRate');

      // ---- module 1 ----
      var target = parseFloat(targetInput.value);
      if (!(target > 0)) target = null;

      if (start > 0 && target !== null) {
        ttl.textContent = r1(start - target) + ' ' + u();
      } else {
        ttl.textContent = '—';
      }

      // show the exact percentage the entered target represents
      if (start > 0 && target !== null && target < start) {
        pctOut.textContent = r1((start - target) / start * 100) + '%';
      } else {
        pctOut.textContent = pct + '%';
      }

      // ---- module 2 ----
      if (!(start > 0) || !(current > 0) || target === null) {
        wl.textContent = '—';
        pl.textContent = '—';
        tl.textContent = '—';
        wr.style.display = 'none';
        return;
      }

      var lost = r1(start - current);
      var lostPct = r1((start - current) / start * 100);
      wl.textContent = lost + ' ' + u();
      pl.textContent = lostPct + '%';

      var remaining = r1(current - target);
      if (remaining <= 0) {
        tl.textContent = 'Target reached';
        wr.style.display = 'none';
      } else {
        tl.textContent = remaining + ' ' + u();
        if (weeks > 0 && lost > 0) {
          var rate = lost / weeks;
          var weeksLeft = Math.ceil(remaining / rate);
          wr.innerHTML =
            'Avg ' + r1(rate) + ' ' + u() + '/week so far' +
            '<br><strong>' + weeksLeft + ' more week' + (weeksLeft === 1 ? '' : 's') +
            '</strong> at this rate (' + (weeks + weeksLeft) + ' total)';
          wr.style.display = 'block';
        } else {
          wr.style.display = 'none';
        }
      }
    }

    startInput.addEventListener('input', applyPercent);
    targetInput.addEventListener('input', applyTarget);
    currentInput.addEventListener('input', update);
    weeksInput.addEventListener('input', update);
    goalSlider.addEventListener('input', applyPercent);
    update();
  </script>
</body>
</html>
