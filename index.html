<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Loss Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #57068C;
      padding: 16px;
      min-height: 100vh;
      color: #ffffff;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 21px;
      font-weight: 500;
      line-height: 1.15;
      color: #ffffff;
    }

    .input-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 12px;
      color: #E6D9F2;
      margin-bottom: 3px;
      font-weight: 500;
    }

    input[type="number"] {
      padding: 7px 10px;
      font-size: 16px;
      border: 0.5px solid #d3d1c7;
      border-radius: 8px;
      font-family: inherit;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #57068C;
      box-shadow: 0 0 0 2px rgba(87, 6, 140, 0.15);
    }

    .metrics {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .metric-card {
      background: #cfcdc6;
      border-radius: 8px;
      padding: 10px 12px;
      border: 0.5px solid #d3d1c7;
    }

    .unit-btn {
      padding: 5px 11px;
      font-size: 13px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 500;
      color: #D9C2EC;
      transition: all 0.15s;
      border-radius: 4px;
    }

    .unit-btn.active {
      background: #ffffff;
      color: #000000;
    }

    .unit-btn:hover:not(.active) {
      color: #000000;
    }

    .goal-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .timeline-group {
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 12px;
      color: #4a4844;
      margin-bottom: 2px;
    }

    .metric-value {
      font-size: 21px;
      font-weight: 500;
      color: #000000;
    }

    .goal-section {
      margin-bottom: 10px;
    }

    .goal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .goal-header label {
      font-weight: 500;
      color: #888780;
      margin: 0;
    }

    .goal-slider-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: #B08FD4;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #57068C;
      cursor: pointer;
      border: 2px solid #cfcdc6;
      box-shadow: 0 0 0 1px #57068C;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #57068C;
      cursor: pointer;
      border: 2px solid #cfcdc6;
      box-shadow: 0 0 0 1px #57068C;
    }

    .goal-percent {
      font-size: 14px;
      font-weight: 500;
      min-width: 50px;
      text-align: right;
      color: #ffffff;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .quick-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 13px;
      background: #cfcdc6;
      border: 0.5px solid #d3d1c7;
      border-radius: 8px;
      cursor: pointer;
      color: #000000;
      font-weight: 500;
      transition: background 0.15s;
    }

    .quick-btn:hover {
      background: #EFE4F7;
    }

    .quick-btn:active {
      transform: scale(0.98);
    }

    .goal-card {
      background: #EFE4F7;
      border-radius: 8px;
      padding: 10px 12px;
      border: 0.5px solid #B08FD4;
    }

    .goal-label {
      font-size: 12px;
      color: #57068C;
      margin-bottom: 2px;
      font-weight: 500;
    }

    .goal-value {
      font-size: 20px;
      font-weight: 500;
      color: #000000;
    }

  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px;">
      <h1>Weight loss calculator</h1>
      <div style="display: flex; gap: 6px; background: #3D0463; border-radius: 6px; padding: 3px; flex-shrink: 0;">
        <button class="unit-btn active" data-unit="lbs" onclick="switchUnit('lbs')">lbs</button>
        <button class="unit-btn" data-unit="kg" onclick="switchUnit('kg')">kg</button>
      </div>
    </div>

    <div class="input-grid">
      <div class="input-group">
        <label for="startWeight">Starting weight</label>
        <input type="number" id="startWeight" placeholder="lbs" />
      </div>
      <div class="input-group">
        <label for="currentWeight">Current weight</label>
        <input type="number" id="currentWeight" placeholder="lbs" />
      </div>
    </div>

    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">Weight lost</div>
        <div class="metric-value" id="weightLost">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">% lost</div>
        <div class="metric-value" id="percentLost">—</div>
      </div>
    </div>

    <div class="goal-section">
      <div class="goal-row">
        <div class="input-group">
          <label for="goalWeight">Goal weight</label>
          <input type="number" id="goalWeight" placeholder="0" />
        </div>
        <div class="input-group">
          <label for="goalPercent">Or by % loss</label>
          <div class="goal-slider-group">
            <input type="range" id="goalSlider" min="5" max="50" value="10" />
            <span class="goal-percent" id="goalPercent">10%</span>
          </div>
        </div>
      </div>

      <div class="button-group">
        <button class="quick-btn" onclick="setGoal(5)">5%</button>
        <button class="quick-btn" onclick="setGoal(10)">10%</button>
        <button class="quick-btn" onclick="setGoal(15)">15%</button>
        <button class="quick-btn" onclick="setGoal(20)">20%</button>
      </div>

      <div class="timeline-group" style="margin-top: 10px;">
        <label for="weeks">Weeks to goal</label>
        <input type="number" id="weeks" placeholder="0" style="padding: 7px 10px; font-size: 16px; border: 0.5px solid #B08FD4; border-radius: 8px; font-family: inherit; background: #ffffff; color: #000000;" />
      </div>
    </div>

    <div class="goal-card">
      <div class="goal-label">To reach goal</div>
      <div class="goal-value" id="toLose">—</div>
      <div style="font-size: 13px; color: rgba(87, 6, 140, 0.75); margin-top: 8px; padding-top: 8px; border-top: 0.5px solid rgba(87, 6, 140, 0.2);" id="weeklyRate"></div>
    </div>
  </div>

  <script>
    const startInput = document.getElementById('startWeight');
    const currentInput = document.getElementById('currentWeight');
    const goalSlider = document.getElementById('goalSlider');
    const goalWeightInput = document.getElementById('goalWeight');
    const weeksInput = document.getElementById('weeks');
    let currentUnit = 'lbs';

    function switchUnit(unit) {
      if (unit === currentUnit) return;

      const factor = unit === 'kg' ? 0.453592 : 2.20462;
      
      if (startInput.value) {
        startInput.value = Math.round(parseFloat(startInput.value) * factor * 10) / 10;
      }
      if (currentInput.value) {
        currentInput.value = Math.round(parseFloat(currentInput.value) * factor * 10) / 10;
      }
      if (goalWeightInput.value) {
        goalWeightInput.value = Math.round(parseFloat(goalWeightInput.value) * factor * 10) / 10;
      }

      currentUnit = unit;
      updateUnitLabel();
      
      document.querySelectorAll('.unit-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-unit="${unit}"]`).classList.add('active');

      updateCalc();
    }

    function updateUnitLabel() {
      document.querySelectorAll('input[type="number"]').forEach(input => {
        if (input.placeholder && input.placeholder !== '0') {
          input.placeholder = currentUnit;
        }
      });
    }

    function setGoal(value) {
      goalSlider.value = value;
      goalWeightInput.value = '';
      updateCalc();
    }

    function updateCalc() {
      const start = parseFloat(startInput.value);
      const current = parseFloat(currentInput.value);
      const goalPercent = parseInt(goalSlider.value);
      const goalWeight = parseFloat(goalWeightInput.value);
      const weeks = parseFloat(weeksInput.value);

      document.getElementById('goalPercent').textContent = goalPercent + '%';

      if (!start || !current) {
        document.getElementById('weightLost').textContent = '—';
        document.getElementById('percentLost').textContent = '—';
        document.getElementById('toLose').textContent = '—';
        document.getElementById('weeklyRate').textContent = '';
        return;
      }

      const lost = Math.round((start - current) * 10) / 10;
      const pct = Math.round((lost / start) * 1000) / 10;

      let remaining = 0;
      let targetWeight = 0;

      if (goalWeight && goalWeight > 0) {
        targetWeight = goalWeight;
        remaining = Math.max(0, Math.round((current - targetWeight) * 10) / 10);
      } else {
        targetWeight = start * (1 - goalPercent / 100);
        remaining = Math.max(0, Math.round((current - targetWeight) * 10) / 10);
      }

      const unitLabel = currentUnit === 'lbs' ? 'lbs' : 'kg';
      document.getElementById('weightLost').textContent = lost + ' ' + unitLabel;
      document.getElementById('percentLost').textContent = pct + '%';

      if (remaining === 0) {
        document.getElementById('toLose').textContent = '✓ Goal reached!';
        document.getElementById('weeklyRate').textContent = '';
      } else {
        document.getElementById('toLose').textContent = remaining + ' ' + unitLabel;
        
        if (weeks && weeks > 0) {
          const weekly = Math.round((remaining / weeks) * 10) / 10;
          document.getElementById('weeklyRate').textContent = `${weekly} ${unitLabel}/week`;
        } else {
          document.getElementById('weeklyRate').textContent = '';
        }
      }
    }

    startInput.addEventListener('input', updateCalc);
    currentInput.addEventListener('input', updateCalc);
    goalSlider.addEventListener('input', updateCalc);
    goalWeightInput.addEventListener('input', updateCalc);
    weeksInput.addEventListener('input', updateCalc);
  </script>
</body>
</html>
