<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Loss Calculator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #57068C;
      padding: 14px 16px;
      min-height: 100vh;
      color: #ffffff;
    }

    .container { max-width: 500px; margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 { font-size: 20px; font-weight: 500; line-height: 1.15; }

    .unit-toggle {
      display: flex;
      gap: 6px;
      background: #3D0463;
      border-radius: 6px;
      padding: 3px;
      flex-shrink: 0;
    }

    .unit-btn {
      padding: 5px 11px;
      font-size: 13px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 500;
      color: #D9C2EC;
      transition: all 0.15s;
      border-radius: 4px;
    }
    .unit-btn.active { background: #ffffff; color: #000000; }
    .unit-btn:hover:not(.active) { color: #ffffff; }

    /* ---- module shell ---- */
    .module {
      background: rgba(255,255,255,0.07);
      border: 0.5px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 11px;
    }

    .module-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #D9C2EC;
      margin-bottom: 9px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #E6D9F2;
      margin-bottom: 3px;
      font-weight: 500;
    }

    input[type="number"] {
      width: 100%;
      padding: 7px 10px;
      font-size: 16px;
      border: 0.5px solid #B08FD4;
      border-radius: 8px;
      font-family: inherit;
      background: #ffffff;
      color: #000000;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.35);
    }

    .row2 {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 10px;
    }

    .button-group { display: flex; gap: 6px; margin-top: 9px; }

    .quick-btn {
      flex: 1;
      padding: 7px 4px;
      font-size: 13px;
      background: rgba(255,255,255,0.14);
      border: 0.5px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      cursor: pointer;
      color: #ffffff;
      font-weight: 600;
      transition: all 0.15s;
    }
    .quick-btn:hover { background: rgba(255,255,255,0.24); }
    .quick-btn.selected {
      background: #ffffff;
      color: #57068C;
      border-color: #ffffff;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 9px;
    }
    .slider-row span {
      font-size: 13px;
      font-weight: 600;
      min-width: 38px;
      text-align: right;
      color: #ffffff;
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: #B08FD4;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      border: 2px solid #57068C;
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      border: 2px solid #57068C;
    }

    /* ---- result cards ---- */
    .card {
      background: #cfcdc6;
      border-radius: 8px;
      padding: 9px 11px;
      border: 0.5px solid #b8b6ae;
    }
    .card-label {
      font-size: 11px;
      color: #4a4844;
      margin-bottom: 2px;
      font-weight: 500;
    }
    .card-value { font-size: 19px; font-weight: 600; color: #000000; }

    .card-primary {
      background: #EFE4F7;
      border-color: #B08FD4;
    }
    .card-primary .card-label { color: #57068C; }

    .cards2 {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 8px;
      margin-top: 9px;
    }

    .row3 {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 8px;
    }

    .bmi-chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .subnote {
      font-size: 12px;
      color: rgba(87,6,140,0.75);
      margin-top: 6px;
      padding-top: 6px;
      line-height: 1.45;
      border-top: 0.5px solid rgba(87,6,140,0.2);
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="topbar">
      <h1>Weight loss calculator</h1>
      <div class="unit-toggle">
        <button class="unit-btn active" data-unit="lbs" onclick="switchUnit('lbs')">lbs</button>
        <button class="unit-btn" data-unit="kg" onclick="switchUnit('kg')">kg</button>
      </div>
    </div>

    <!-- MODULE 1 — goal setting -->
    <div class="module">
      <div class="module-title">1 · Set goal</div>

      <div class="row2">
        <div>
          <label for="startWeight">Starting weight</label>
          <input type="number" id="startWeight" inputmode="decimal" placeholder="lbs" />
        </div>
        <div>
          <label for="targetWeight">Target weight</label>
          <input type="number" id="targetWeight" inputmode="decimal" placeholder="lbs" />
        </div>
      </div>

      <div id="heightImperial" style="margin-top: 9px;">
        <label>Height</label>
        <div class="row3">
          <input type="number" id="heightFt" inputmode="numeric" placeholder="ft" />
          <input type="number" id="heightIn" inputmode="numeric" placeholder="in" />
        </div>
      </div>

      <div id="heightMetric" style="margin-top: 9px; display: none;">
        <label for="heightCm">Height</label>
        <input type="number" id="heightCm" inputmode="numeric" placeholder="cm" />
      </div>

      <div class="button-group">
        <button class="quick-btn" data-pct="5" onclick="setGoal(5)">5%</button>
        <button class="quick-btn selected" data-pct="10" onclick="setGoal(10)">10%</button>
        <button class="quick-btn" data-pct="15" onclick="setGoal(15)">15%</button>
        <button class="quick-btn" data-pct="20" onclick="setGoal(20)">20%</button>
      </div>

      <div class="slider-row">
        <input type="range" id="goalSlider" min="1" max="50" value="10" />
        <span id="goalPercent">10%</span>
      </div>

      <div class="cards2">
        <div class="card card-primary" style="grid-column: 1 / -1;">
          <div class="card-label">Total to lose</div>
          <div class="card-value" id="totalToLose">—</div>
        </div>
      </div>
    </div>

    <!-- MODULE 2 — visit tracking -->
    <div class="module">
      <div class="module-title">2 · This visit</div>

      <div class="row2">
        <div>
          <label for="currentWeight">Current weight</label>
          <input type="number" id="currentWeight" inputmode="decimal" placeholder="lbs" />
        </div>
        <div>
          <label for="weeks">Weeks elapsed</label>
          <input type="number" id="weeks" inputmode="decimal" placeholder="0" />
        </div>
      </div>

      <div class="cards2">
        <div class="card">
          <div class="card-label">Weight lost</div>
          <div class="card-value" id="weightLost">—</div>
        </div>
        <div class="card">
          <div class="card-label">% lost</div>
          <div class="card-value" id="percentLost">—</div>
        </div>
      </div>

      <div class="cards2">
        <div class="card card-primary" style="grid-column: 1 / -1;">
          <div class="card-label">Remaining to target</div>
          <div class="card-value" id="toLose">—</div>
          <div class="subnote" id="weeklyRate" style="display:none;"></div>
        </div>
      </div>
    </div>

    <!-- MODULE 3 — BMI -->
    <div class="module">
      <div class="module-title">3 · BMI</div>

      <div class="cards2" style="margin-top: 0;">
        <div class="card">
          <div class="card-label">Starting BMI</div>
          <div class="card-value">
            <span id="bmiStart">—</span><span class="bmi-chip" id="bmiStartCat" style="display:none;"></span>
          </div>
        </div>
        <div class="card">
          <div class="card-label">Current BMI</div>
          <div class="card-value">
            <span id="bmiNow">—</span><span class="bmi-chip" id="bmiCat" style="display:none;"></span>
          </div>
        </div>
      </div>

      <div class="cards2">
        <div class="card" style="grid-column: 1 / -1;">
          <div class="card-label">Weight at BMI 25</div>
          <div class="card-value" id="bmi25Weight">—</div>
        </div>
      </div>

      <div class="cards2">
        <div class="card card-primary" style="grid-column: 1 / -1;">
          <div class="card-label" id="bmiGapLabel">To reach BMI 25</div>
          <div class="card-value" id="bmiGap">—</div>
          <div class="subnote" id="bmiNote" style="display:none;"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    var startInput   = document.getElementById('startWeight');
    var targetInput  = document.getElementById('targetWeight');
    var ftInput      = document.getElementById('heightFt');
    var inInput      = document.getElementById('heightIn');
    var cmInput      = document.getElementById('heightCm');
    var currentInput = document.getElementById('currentWeight');
    var weeksInput   = document.getElementById('weeks');
    var goalSlider   = document.getElementById('goalSlider');
    var currentUnit  = 'lbs';

    function r1(n) { return Math.round(n * 10) / 10; }
    function u() { return currentUnit; }

    function switchUnit(unit) {
      if (unit === currentUnit) return;
      var f = unit === 'kg' ? 0.453592 : 2.20462;
      [startInput, targetInput, currentInput].forEach(function (el) {
        if (el.value !== '') el.value = r1(parseFloat(el.value) * f);
      });
      // height: convert between ft/in and cm
      if (unit === 'kg') {
        var totIn = (parseFloat(ftInput.value) || 0) * 12 + (parseFloat(inInput.value) || 0);
        if (totIn > 0) cmInput.value = Math.round(totIn * 2.54);
        document.getElementById('heightImperial').style.display = 'none';
        document.getElementById('heightMetric').style.display = 'block';
      } else {
        var cm = parseFloat(cmInput.value);
        if (cm > 0) {
          var ti = cm / 2.54;
          ftInput.value = Math.floor(ti / 12);
          inInput.value = Math.round(ti % 12);
        }
        document.getElementById('heightImperial').style.display = 'block';
        document.getElementById('heightMetric').style.display = 'none';
      }

      currentUnit = unit;
      startInput.placeholder = unit;
      targetInput.placeholder = unit;
      currentInput.placeholder = unit;
      var btns = document.querySelectorAll('.unit-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].getAttribute('data-unit') === unit);
      }
      update();
    }

    // percentage -> target weight
    function applyPercent() {
      var start = parseFloat(startInput.value);
      var pct = parseInt(goalSlider.value, 10);
      if (start > 0) targetInput.value = r1(start * (1 - pct / 100));
      update();
    }

    // target weight -> percentage (clamped to slider range)
    function applyTarget() {
      var start = parseFloat(startInput.value);
      var target = parseFloat(targetInput.value);
      if (start > 0 && target > 0 && target < start) {
        var pct = (start - target) / start * 100;
        goalSlider.value = Math.min(50, Math.max(1, Math.round(pct)));
      }
      update();
    }

    function setGoal(v) {
      goalSlider.value = v;
      applyPercent();
    }

    function syncQuickButtons(pct) {
      var btns = document.querySelectorAll('.quick-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('selected', Number(btns[i].getAttribute('data-pct')) === pct);
      }
    }

    function update() {
      var start = parseFloat(startInput.value);
      var current = parseFloat(currentInput.value);
      var weeks = parseFloat(weeksInput.value);
      var pct = parseInt(goalSlider.value, 10);

      var pctOut = document.getElementById('goalPercent');
      syncQuickButtons(pct);

      var ttl = document.getElementById('totalToLose');
      var wl = document.getElementById('weightLost');
      var pl = document.getElementById('percentLost');
      var tl = document.getElementById('toLose');
      var wr = document.getElementById('weeklyRate');

      updateBmi();

      // ---- module 1 ----
      var target = parseFloat(targetInput.value);
      if (!(target > 0)) target = null;

      if (start > 0 && target !== null) {
        ttl.textContent = r1(start - target) + ' ' + u();
      } else {
        ttl.textContent = '—';
      }

      // show the exact percentage the entered target represents
      if (start > 0 && target !== null && target < start) {
        pctOut.textContent = r1((start - target) / start * 100) + '%';
      } else {
        pctOut.textContent = pct + '%';
      }

      // ---- module 2 ----
      if (!(start > 0) || !(current > 0) || target === null) {
        wl.textContent = '—';
        pl.textContent = '—';
        tl.textContent = '—';
        wr.style.display = 'none';
        return;
      }

      var lost = r1(start - current);
      var lostPct = r1((start - current) / start * 100);
      wl.textContent = lost + ' ' + u();
      pl.textContent = lostPct + '%';

      var remaining = r1(current - target);
      if (remaining <= 0) {
        tl.textContent = 'Target reached';
        wr.style.display = 'none';
      } else {
        tl.textContent = remaining + ' ' + u();
        if (weeks > 0 && lost > 0) {
          var rate = lost / weeks;
          var weeksLeft = Math.ceil(remaining / rate);
          wr.innerHTML =
            'Avg ' + r1(rate) + ' ' + u() + '/week so far' +
            '<br><strong>' + weeksLeft + ' more week' + (weeksLeft === 1 ? '' : 's') +
            '</strong> at this rate (' + (weeks + weeksLeft) + ' total)';
          wr.style.display = 'block';
        } else {
          wr.style.display = 'none';
        }
      }
    }

    // ---- BMI ----
    function heightMeters() {
      if (currentUnit === 'kg') {
        var cm = parseFloat(cmInput.value);
        return cm > 0 ? cm / 100 : null;
      }
      var ft = parseFloat(ftInput.value) || 0;
      var inch = parseFloat(inInput.value) || 0;
      var totIn = ft * 12 + inch;
      return totIn > 0 ? totIn * 0.0254 : null;
    }

    function toKg(w) { return currentUnit === 'kg' ? w : w * 0.453592; }
    function fromKg(w) { return currentUnit === 'kg' ? w : w * 2.20462; }

    function bmiCategory(b) {
      if (b < 18.5) return ['Under', '#8a6d1f', '#f5e6b8'];
      if (b < 25)   return ['Normal', '#1d6b3a', '#c8e6d0'];
      if (b < 30)   return ['Over', '#8a4a1f', '#f5d9c0'];
      return ['Obese', '#8a1f1f', '#f5c8c8'];
    }

    function paintChip(el, b) {
      var cat = bmiCategory(b);
      el.textContent = cat[0];
      el.style.color = cat[1];
      el.style.background = cat[2];
      el.style.display = 'inline-block';
    }

    function updateBmi() {
      var h = heightMeters();
      var current = parseFloat(currentInput.value);
      var start = parseFloat(startInput.value);
      var w = current;

      var bmiStart = document.getElementById('bmiStart');
      var bmiStartCat = document.getElementById('bmiStartCat');
      var bmiNow = document.getElementById('bmiNow');
      var bmiCat = document.getElementById('bmiCat');
      var bmi25W = document.getElementById('bmi25Weight');
      var bmiGap = document.getElementById('bmiGap');
      var bmiGapLabel = document.getElementById('bmiGapLabel');
      var bmiNote = document.getElementById('bmiNote');

      if (!h) {
        bmiStart.textContent = '—';
        bmiStartCat.style.display = 'none';
        bmiNow.textContent = '—';
        bmiCat.style.display = 'none';
        bmi25W.textContent = '—';
        bmiGap.textContent = '—';
        bmiNote.style.display = 'none';
        return;
      }

      // weight at BMI 25 always available once height is known
      var w25 = fromKg(25 * h * h);
      bmi25W.textContent = r1(w25) + ' ' + u();

      // starting BMI
      if (start > 0) {
        var bStart = toKg(start) / (h * h);
        bmiStart.textContent = r1(bStart);
        paintChip(bmiStartCat, bStart);
      } else {
        bmiStart.textContent = '—';
        bmiStartCat.style.display = 'none';
      }

      if (!(w > 0)) {
        bmiNow.textContent = '—';
        bmiCat.style.display = 'none';
        bmiGap.textContent = '—';
        bmiNote.style.display = 'none';
        return;
      }

      var b = toKg(w) / (h * h);
      bmiNow.textContent = r1(b);

      paintChip(bmiCat, b);

      var gap = r1(w - w25);
      if (gap <= 0) {
        bmiGapLabel.textContent = 'BMI 25 threshold';
        bmiGap.textContent = 'Already below';
        bmiNote.style.display = 'none';
      } else {
        bmiGapLabel.textContent = 'To reach BMI 25';
        bmiGap.textContent = gap + ' ' + u();
        bmiNote.innerHTML = 'That is ' + r1(gap / w * 100) + '% of current weight. BMI 25 is the top of the normal range, not a recommended target.';
        bmiNote.style.display = 'block';
      }
    }

    startInput.addEventListener('input', applyPercent);
    targetInput.addEventListener('input', applyTarget);
    currentInput.addEventListener('input', update);
    weeksInput.addEventListener('input', update);
    goalSlider.addEventListener('input', applyPercent);
    ftInput.addEventListener('input', update);
    inInput.addEventListener('input', update);
    cmInput.addEventListener('input', update);
    update();
  </script>
</body>
</html>
