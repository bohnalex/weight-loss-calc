<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Loss Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f9f8f3;
      padding: 20px;
      min-height: 100vh;
      color: #2c2c2a;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 24px;
      color: #2c2c2a;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 13px;
      color: #888780;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="number"] {
      padding: 10px 12px;
      font-size: 16px;
      border: 0.5px solid #d3d1c7;
      border-radius: 8px;
      font-family: inherit;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #185fa5;
      box-shadow: 0 0 0 2px rgba(24, 95, 165, 0.1);
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }

    .metric-card {
      background: #f1efe8;
      border-radius: 8px;
      padding: 16px;
      border: 0.5px solid #d3d1c7;
    }

    .metric-label {
      font-size: 13px;
      color: #888780;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 500;
      color: #2c2c2a;
    }

    .goal-section {
      margin-bottom: 24px;
    }

    .goal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .goal-header label {
      font-weight: 500;
      color: #888780;
      margin: 0;
    }

    .goal-slider-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: #d3d1c7;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #185fa5;
      cursor: pointer;
      border: 2px solid #f1efe8;
      box-shadow: 0 0 0 1px #185fa5;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #185fa5;
      cursor: pointer;
      border: 2px solid #f1efe8;
      box-shadow: 0 0 0 1px #185fa5;
    }

    .goal-percent {
      font-size: 14px;
      font-weight: 500;
      min-width: 50px;
      text-align: right;
      color: #2c2c2a;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .quick-btn {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      background: #f1efe8;
      border: 0.5px solid #d3d1c7;
      border-radius: 8px;
      cursor: pointer;
      color: #2c2c2a;
      font-weight: 500;
      transition: background 0.15s;
    }

    .quick-btn:hover {
      background: #e1dfd6;
    }

    .quick-btn:active {
      transform: scale(0.98);
    }

    .goal-card {
      background: #e6f1fb;
      border-radius: 8px;
      padding: 16px;
      border: 0.5px solid #85b7eb;
    }

    .goal-label {
      font-size: 13px;
      color: #185fa5;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .goal-value {
      font-size: 22px;
      font-weight: 500;
      color: #185fa5;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #2c2c2a;
        color: #f1efe8;
      }

      h1 {
        color: #f1efe8;
      }

      input[type="number"] {
        background: #404038;
        border-color: #5f5e5a;
        color: #f1efe8;
      }

      input[type="number"]:focus {
        border-color: #85b7eb;
      }

      .metric-card {
        background: #404038;
        border-color: #5f5e5a;
      }

      .metric-label {
        color: #b4b2a9;
      }

      .metric-value {
        color: #f1efe8;
      }

      .goal-header label {
        color: #b4b2a9;
      }

      input[type="range"] {
        background: #5f5e5a;
      }

      input[type="range"]::-webkit-slider-thumb {
        background: #85b7eb;
        box-shadow: 0 0 0 1px #85b7eb;
      }

      input[type="range"]::-moz-range-thumb {
        background: #85b7eb;
        box-shadow: 0 0 0 1px #85b7eb;
      }

      .goal-percent {
        color: #f1efe8;
      }

      .quick-btn {
        background: #404038;
        border-color: #5f5e5a;
        color: #f1efe8;
      }

      .quick-btn:hover {
        background: #4f4e49;
      }

      .goal-card {
        background: #0c447c;
        border-color: #378add;
      }

      .goal-label {
        color: #85b7eb;
      }

      .goal-value {
        color: #85b7eb;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Weight loss calculator</h1>

    <div class="input-grid">
      <div class="input-group">
        <label for="startWeight">Starting weight</label>
        <input type="number" id="startWeight" placeholder="lbs" />
      </div>
      <div class="input-group">
        <label for="currentWeight">Current weight</label>
        <input type="number" id="currentWeight" placeholder="lbs" />
      </div>
    </div>

    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">Weight lost</div>
        <div class="metric-value" id="weightLost">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">% lost</div>
        <div class="metric-value" id="percentLost">—</div>
      </div>
    </div>

    <div class="goal-section">
      <div class="goal-header">
        <label>Goal</label>
        <div class="goal-slider-group">
          <input type="range" id="goalSlider" min="5" max="50" value="10" />
          <span class="goal-percent" id="goalPercent">10%</span>
        </div>
      </div>
      <div class="button-group">
        <button class="quick-btn" onclick="setGoal(5)">5%</button>
        <button class="quick-btn" onclick="setGoal(10)">10%</button>
        <button class="quick-btn" onclick="setGoal(15)">15%</button>
        <button class="quick-btn" onclick="setGoal(20)">20%</button>
      </div>
    </div>

    <div class="goal-card">
      <div class="goal-label">To reach goal</div>
      <div class="goal-value" id="toLose">—</div>
    </div>
  </div>

  <script>
    const startInput = document.getElementById('startWeight');
    const currentInput = document.getElementById('currentWeight');
    const goalSlider = document.getElementById('goalSlider');

    function setGoal(value) {
      goalSlider.value = value;
      updateCalc();
    }

    function updateCalc() {
      const start = parseFloat(startInput.value);
      const current = parseFloat(currentInput.value);
      const goal = parseInt(goalSlider.value);

      document.getElementById('goalPercent').textContent = goal + '%';

      if (!start || !current) {
        document.getElementById('weightLost').textContent = '—';
        document.getElementById('percentLost').textContent = '—';
        document.getElementById('toLose').textContent = '—';
        return;
      }

      const lost = Math.round((start - current) * 10) / 10;
      const pct = Math.round((lost / start) * 1000) / 10;
      const targetWeight = start * (1 - goal / 100);
      const remaining = Math.max(0, Math.round((current - targetWeight) * 10) / 10);

      document.getElementById('weightLost').textContent = lost + ' lbs';
      document.getElementById('percentLost').textContent = pct + '%';
      document.getElementById('toLose').textContent = remaining === 0 ? '✓ Goal reached!' : remaining + ' lbs';
    }

    startInput.addEventListener('input', updateCalc);
    currentInput.addEventListener('input', updateCalc);
    goalSlider.addEventListener('input', updateCalc);
  </script>
</body>
</html>
